[package]
name = "ship-game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_winit",
    "x11",
    "bevy_scene",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gltf",
    # Character GLBs use skinned meshes / clips; scenes reference animation types that must
    # be registered (otherwise ScenePlugin panics with "unregistered type" on WASM).
    "gltf_animation",
    # Required when default Bevy features are disabled: auto-register reflected engine types
    # (e.g. Transform) so SceneSpawner can materialize GLTF scenes.
    "reflect_auto_register",
    # Shows real `type_name` in panics (e.g. scene spawner) instead of "<Enable the debug feature…>".
    # Remove for smaller release WASM if you no longer need that signal.
    "debug",
    "bevy_text",
    "bevy_ui",
    # Required to actually render Bevy UI (Text, Node, etc.). Without these the
    # UI hierarchy exists but nothing is drawn.
    "bevy_ui_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_asset",
    "bevy_color",
    "tonemapping_luts",
    "default_font",
    "webgl2",
    "png",
    "zstd_rust",
] }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
